<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DQSG 體力回復藥計算器</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#fff;color:#243653}
.wrap{max-width:1200px;margin:auto;padding:20px}
.hero{background:linear-gradient(135deg,#17375f,#285788);color:#fff;border-radius:18px;padding:24px;text-align:center;box-shadow:0 8px 24px #0002}
.hero h1{margin:0;font-size:clamp(28px,5vw,48px)}
.hero p{margin:10px 0 0;font-size:clamp(15px,2.5vw,22px)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
.card{border:3px solid;border-radius:18px;padding:18px;text-align:center;background:#f7fbff;box-shadow:0 5px 15px #0001}
.small{border-color:#bce5d3;background:#f2fbf7} .medium{border-color:#b9d9f8;background:#f3f9ff} .large{border-color:#d5c9f5;background:#f8f5ff}
.potion{height:175px;display:flex;align-items:center;justify-content:center}
.potion img{width:100%;height:175px;object-fit:contain}
.card h2{margin:8px 0;color:#fff;border-radius:30px;padding:8px;font-size:clamp(18px,2.4vw,26px)}
.small h2{background:#27956b} .medium h2{background:#287ed0} .large h2{background:#6945bd}
.restore{font-size:20px;margin:12px 0} .restore b{font-size:42px}
.small .restore b{color:#27956b} .medium .restore b{color:#287ed0} .large .restore b{color:#6945bd}
.qty{display:flex;border:3px solid #d8e1ef;border-radius:14px;background:#fff;overflow:hidden;margin:12px auto 6px;max-width:370px}
.qty button{width:64px;border:0;background:#edf2f8;font-size:30px;font-weight:bold;color:#243653;cursor:pointer}
.qty input{min-width:0;flex:1;border:0;text-align:center;font-size:30px;font-weight:bold;color:#243653;outline:0}
.label{font-size:16px;color:#657590}
.result{margin-top:20px;border:3px solid #b9d9f8;border-radius:18px;padding:22px;background:#f5faff;display:grid;grid-template-columns:1fr 1.3fr;gap:25px}
.result h2{margin:0 0 12px;font-size:28px;color:#145ca8}
.total{background:#e4f2ff;border:3px solid #c7e2ff;border-radius:15px;padding:20px;text-align:center;font-size:26px}
.total b{display:block;font-size:64px;line-height:1.1;color:#1464b8}
.detail{border-left:3px solid #d7e8f8;padding-left:25px}
.row{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:7px 0;font-size:18px}
.row b{font-weight:800}
.sum{border-top:2px solid #c8dced;margin-top:8px;padding-top:12px;font-weight:900;color:#1464b8}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:15px}
.reset{border:2px solid #d3ddea;background:#edf2f8;border-radius:30px;padding:12px 25px;font-size:18px;font-weight:bold;color:#243653;cursor:pointer}
.note{color:#75849d}
@media(max-width:760px){
 .wrap{padding:12px}
 .cards{grid-template-columns:1fr;gap:12px}
 .card{display:grid;grid-template-columns:120px 1fr;align-items:center;text-align:left;padding:12px}
 .potion{grid-row:1/5;height:155px}
 .potion img{width:120px;height:155px}
 .card h2{margin:0;text-align:center}
 .restore{text-align:center;margin:5px 0}
 .qty{margin:5px 0;max-width:none}
 .label{text-align:center}
 .result{grid-template-columns:1fr;gap:15px;padding:15px}
 .detail{border-left:0;border-top:3px solid #d7e8f8;padding:15px 0 0}
 .row{font-size:15px;grid-template-columns:1fr auto auto auto;gap:5px}
 .bottom{flex-direction:column;align-items:stretch;text-align:center}
}
@media(max-width:430px){
 .card{grid-template-columns:95px 1fr}
 .potion img{width:95px}
 .hero{padding:18px 10px}
 .hero p{font-size:14px}
 .total b{font-size:50px}
}
</style>
</head>

<script>
function get(id){let n=parseInt(document.getElementById(id).value,10);return Number.isFinite(n)&&n>0?n:0}
function change(id,d){let el=document.getElementById(id);el.value=Math.max(0,get(id)+d);calc()}
function calc(){
 const s=get('small'),m=get('medium'),l=get('large'),st=s*15,mt=m*30,lt=l*50,total=st+mt+lt;
 document.getElementById('s').textContent=s;document.getElementById('m').textContent=m;document.getElementById('l').textContent=l;
 document.getElementById('st').textContent=st.toLocaleString();document.getElementById('mt').textContent=mt.toLocaleString();document.getElementById('lt').textContent=lt.toLocaleString();
 document.getElementById('total').textContent=total.toLocaleString();document.getElementById('sum').textContent=total.toLocaleString();
}
function resetAll(){['small','medium','large'].forEach(id=>document.getElementById(id).value=0);calc()}
document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();
</script>
